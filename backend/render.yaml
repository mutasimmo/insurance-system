services:
  - type: web
    name: insurance-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # ❌ احذف PORT من هنا (Render يحدد المنفذ تلقائياً)
      # - key: PORT
      #   value: 5000
    # ✅ أضف هذه الإعدادات الإضافية
    plan: free
    region: oregon  # أو frankfurt إذا كنت في أوروبا
    healthCheckPath: /  # للتأكد من أن التطبيق يعمل